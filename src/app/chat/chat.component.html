<div class="chat-widget">
  @if (isOpen) {
    <div class="chat-panel">
      <div class="chat-header">
        <span class="chat-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Job Copilot Assistant
        </span>
        <button class="new-chat-btn" (click)="newConversation()" title="Start a new conversation">
          New Chat
        </button>
      </div>

      <div class="chat-messages" #messagesContainer>
        @if (messages.length === 0) {
          <div class="chat-empty">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <p>Ask me anything about your job applications!</p>
          </div>
        }
        @for (msg of messages; track $index) {
          <div class="message" [class.user]="msg.role === 'user'" [class.bot]="msg.role === 'bot'">
            <div class="bubble">
              @if (msg.role === 'user') {
                {{ msg.text }}
              } @else if (msg.text) {
                <div [innerHTML]="renderMarkdown(msg.text)"></div>
              } @else if (isLoading) {
                <div class="typing-dots">
                  <span></span><span></span><span></span>
                </div>
              }
            </div>
          </div>
        }
      </div>

      <div class="chat-input-area">
        <input
          type="text"
          [(ngModel)]="inputText"
          placeholder="Ask something..."
          (keydown.enter)="sendMessage()"
          [disabled]="isLoading"
        />
        <button (click)="sendMessage()" [disabled]="!inputText.trim() || isLoading" title="Send">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  }

  <button class="chat-fab" (click)="toggle()" [class.open]="isOpen" title="Chat with Job Copilot">
    @if (isOpen) {
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    }
  </button>
</div>
